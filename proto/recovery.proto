syntax = "proto3";
package recovery;

service RecoveryService {
  rpc GetTracker (GetTrackerRequest) returns (TrackerResponse);
  rpc GetTrackerByRequest (GetTrackerByRequestRequest) returns (TrackerLookupResponse);
  rpc GetTrackerProgress (GetTrackerRequest) returns (ProgressResponse);
  rpc UploadPhoto (UploadPhotoRequest) returns (HistoryResponse);
  rpc UpdateTreatment (UpdateTreatmentRequest) returns (HistoryResponse);
  rpc CompleteTracker (CompleteTrackerRequest) returns (TrackerResponse);
}

message GetTrackerRequest { string tracker_id = 1; }
message GetTrackerByRequestRequest { string request_id = 1; }

message HistoryResponse {
  string id = 1;
  string record_type = 2;
  string date = 3;
  optional string photo_url = 4;
  optional string change_description = 5;
  string author_id = 6;
}

message TrackerResponse {
  string id = 1;
  string request_id = 2;
  string client_id = 3;
  string expert_id = 4;
  string start_date = 5;
  optional string end_date = 6;
  string status = 7;
  optional string current_stage = 8;
  repeated HistoryResponse history = 9;
}

message TrackerLookupResponse {
  bool found = 1;
  optional TrackerResponse tracker = 2;
}

message ProgressResponse {
  string tracker_id = 1;
  int32 total_days = 2;
  int32 elapsed_days = 3;
  double percent = 4;
  int32 photos_count = 5;
  int32 updates_count = 6;
}

message UploadPhotoRequest {
  string tracker_id = 1;
  string author_id = 2;
  string file_name = 3;
  bytes content = 4;
}

message UpdateTreatmentRequest {
  string tracker_id = 1;
  string expert_id = 2;
  string change_description = 3;
  optional string new_stage = 4;
}

message CompleteTrackerRequest {
  string tracker_id = 1;
  string expert_id = 2;
}
