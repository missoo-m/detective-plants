syntax = "proto3";
package notification;

service NotificationService {
  rpc SendNotification (SendNotificationRequest) returns (NotificationResponse);
  rpc ListNotifications (ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc GetNotificationsSummary (NotificationsSummaryRequest) returns (NotificationsSummaryResponse);
  rpc MarkRead (MarkReadRequest) returns (NotificationResponse);
  rpc MarkAllRead (MarkAllReadRequest) returns (MarkAllReadResponse);
}

message SendNotificationRequest {
  string user_id = 1;
  string type = 2;
  string message = 3;
}

message NotificationResponse {
  string id = 1;
  string user_id = 2;
  string type = 3;
  string message = 4;
  string status = 5;
  string created_at = 6;
}

message ListNotificationsRequest {
  string user_id = 1;
  optional string status = 2;
  optional string notification_type = 3;
  optional bool descending = 4;
  optional int32 limit = 5;
  optional int32 offset = 6;
}
message ListNotificationsResponse { repeated NotificationResponse notifications = 1; }

message NotificationsSummaryRequest { string user_id = 1; }
message NotificationsSummaryResponse {
  int32 total = 1;
  int32 unread = 2;
  map<string, int32> by_type = 3;
}

message MarkReadRequest {
  string notification_id = 1;
  string user_id = 2;
}

message MarkAllReadRequest { string user_id = 1; }
message MarkAllReadResponse { int32 count = 1; }
