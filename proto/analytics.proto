syntax = "proto3";
package analytics;

service AnalyticsService {
  rpc GetExpertStats (GetExpertStatsRequest) returns (ExpertStatsResponse);
  rpc GetTopExperts (TopExpertsRequest) returns (TopExpertsResponse);
  rpc GetDiseaseStats (DiseaseStatsRequest) returns (DiseaseStatsResponse);
  rpc GetPlatformSummary (EmptyRequest) returns (PlatformSummaryResponse);
  rpc GetEventCounters (EventCountersRequest) returns (EventCountersResponse);
}

message EmptyRequest {}

message GetExpertStatsRequest { string expert_id = 1; }
message ExpertStatsResponse {
  string expert_id = 1;
  int32 total_requests = 2;
  int32 completed_requests = 3;
  double avg_rating = 4;
}

message TopExpertsRequest {
  optional string sort_by = 1;
  optional bool descending = 2;
  optional int32 limit = 3;
}
message TopExpertsResponse { repeated ExpertStatsResponse experts = 1; }

message DiseaseStatsRequest {
  string period = 1;
  optional bool descending = 2;
  optional int32 limit = 3;
}
message DiseaseStatsItem {
  string disease_id = 1;
  int32 count = 2;
  string period = 3;
}
message DiseaseStatsResponse { repeated DiseaseStatsItem items = 1; }

message PlatformSummaryResponse {
  int32 experts = 1;
  int32 total_requests = 2;
  int32 completed_requests = 3;
  double completion_rate = 4;
  double avg_rating = 5;
}

message EventCountersRequest { optional string period = 1; }
message EventCounterItem {
  string event_type = 1;
  string period = 2;
  int32 count = 3;
  double amount = 4;
}
message EventCountersResponse { repeated EventCounterItem counters = 1; }
